schema_version: opendrsai.agent-regression-case/1
id: p3.qa.hello
revision: 1
title: P3 formal simple question answering
owner: agent-runtime
tags: [p3, release, smoke, question_answering]
agent: {definition: regression-smoke@1, model_profile: default}
input:
  messages:
    - role: user
      parts: [{type: text, text: hello}]
