    tool_calls: {max: 0}
    skill_activations: {max: 0}
  output:
    type: text
    required_literals: [Hello, OpenDrSai, regression Agent]
  artifacts: {max: 0}
execution: {timeout_seconds: 30, attempts: 1, isolation: required}
