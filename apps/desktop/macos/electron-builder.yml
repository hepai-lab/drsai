appId: com.hepai.opendrsai.macos
productName: OpenDrSai
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - "!src/**"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!tsconfig*.json"
extraResources:
  - from: ../shared/browser-use-worker
    to: browser-use-worker
    filter:
      - "*.py"
      - "requirements.txt"
  - from: resources/runtime
    to: runtime
    filter:
      - "runtime-manifest.json"
      - "runtime-sbom-*.json"
      - "runtime-provenance-*.json"
      - "*.tar.gz"
  - from: resources/update
    to: update
    filter:
      - "update-watchdog.sh"
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: OpenDrSai uses the microphone only when you start voice input.
    NSAppleEventsUsageDescription: OpenDrSai requests automation access only for actions you explicitly approve.
dmg:
  sign: false
protocols:
  - name: OpenDrSai
    schemes:
      - opendrsai
publish:
  provider: github
  owner: hepai-lab
  repo: drsai
