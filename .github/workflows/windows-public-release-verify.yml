name: Windows Public Release Verification

env:
  OPENDRSAI_RELEASE_REPOSITORY: hepai-lab/drsai

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to verify"
        required: true
      full_download:
        description: "Download MSI/runtime and verify hashes/signatures"
        required: false
        type: boolean
        default: true
      channel:
        description: "OSS channel pointer to verify"
        required: false
        type: choice
        options:
          - stable
          - beta
        default: stable

jobs:
  verify-public-windows-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/windows/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve public release URL
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
            $fullDownload = "1"
            $channel = if ("${{ github.event.release.prerelease }}" -eq "true") { "beta" } else { "stable" }
          } else {
            $tag = "${{ inputs.release_tag }}"
            $fullDownload = if ("${{ inputs.full_download }}" -eq "true") { "1" } else { "0" }
            $channel = "${{ inputs.channel }}"
          }

          "OPENDRSAI_RELEASE_BASE_URL=https://download-opendrsai.ihep.ac.cn/releases/$tag/windows" >> $env:GITHUB_ENV
          "OPENDRSAI_RELEASE_METADATA_BASE_URL=https://download-opendrsai.ihep.ac.cn/releases/$tag/windows" >> $env:GITHUB_ENV
          "OPENDRSAI_RELEASE_SUMMARY_URL=https://download-opendrsai.ihep.ac.cn/releases/$tag/windows/release-summary-$channel.json" >> $env:GITHUB_ENV
          "OPENDRSAI_UPDATE_MANIFEST_URL=https://download-opendrsai.ihep.ac.cn/channels/$channel/latest-windows.json" >> $env:GITHUB_ENV
          "VERIFY_PUBLIC_RELEASE_DOWNLOAD=$fullDownload" >> $env:GITHUB_ENV

      - name: Verify public Windows release
        env:
          EXPECTED_WINDOWS_SIGNER_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          EXPECTED_WINDOWS_SIGNER_SUBJECT: ${{ vars.WINDOWS_CERTIFICATE_SUBJECT }}
        run: node --use-system-ca scripts/verify-public-runtime-release.mjs
