[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendrsai-dsh-runtime"
version = "0.1.0.dev0"
description = "Independent OAEP Runtime bridge for DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenDrSai" }]
dependencies = ["jsonschema>=4.23,<5", "cryptography>=43,<51"]

[project.scripts]
opendrsai-dsh-runtime = "opendrsai_dsh_runtime.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/opendrsai_dsh_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"../../../protocol/oaep/oaep.schema.json" = "opendrsai_dsh_runtime/protocol_data/oaep.schema.json"
"../../../protocol/runtime/runtime-control.schema.json" = "opendrsai_dsh_runtime/protocol_data/runtime-control.schema.json"

[tool.hatch.build]
include = [
  "src/opendrsai_dsh_runtime/**/*.py",
  "src/opendrsai_dsh_runtime/**/*.json",
  "src/opendrsai_dsh_runtime/**/*.mjs",
  "src/opendrsai_dsh_runtime/**/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
