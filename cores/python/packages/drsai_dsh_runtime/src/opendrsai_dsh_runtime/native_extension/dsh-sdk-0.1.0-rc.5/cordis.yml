# Production-oriented composition for the OpenDrSai rc.5 extension. This file
# is copied into the immutable composite carrier beside server.mjs.
- id: opendrsai-sdk-jsonrpc-server
  name: '@opendrsai/dsh-sdk-extension'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    baseURL: !!js process.env.DEEPSEEK_BASE_URL
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: enabled
    reasoningEffort: max

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: ask

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    # rc.5's closed SDK carrier does not ship dsh-bash-sandbox. P1 therefore
    # exposes the fully confined filesystem tool family and no shell tool;
    # claiming workspace containment while mounting dsh-bash-local would be a
    # security downgrade.
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: zstd

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
