[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drsai"
license = "MIT"
dynamic = ["version"]
description = "Developed by Dr. Sai's team at the Institute of High Energy Physics, Chinese Academy of Sciences (IHEP, CAS), this is a development framework designed for both single-agent and multi-agent collaborative systems"
readme = "README.md"
requires-python = ">=3.11"
keywords = []
authors = [
    { name = "hepai" }
]
urls = { "Homepage" = "https://github.com/hepaihub/drsai" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    # ── autogen core ──────────────────────────────────────────────────────
    "autogen-agentchat==0.5.7",
    "autogen-core==0.5.7",
    "autogen-ext[openai, anthropic, mcp]==0.5.7",
    # , docker
    
    # ── HepAI platform (pulls in: openai, damei, fastapi, uvicorn, etc.) ─
    "fastapi[standard]",
    "easydict",
    "numpy",
    "hepai>=1.4.8",

    # ── data model & validation ──────────────────────────────────────────
    "pydantic",
    "pydantic-settings",
    "pypdf==6.10.0",

    # ── database ──────────────────────────────────────────────────────────
    "sqlmodel",
    "alembic",

    # ── LLM client extras (hepai brings openai, but tiktoken is needed) ──
    "tiktoken",

    # ── logging & config ──────────────────────────────────────────────────
    "loguru",
    "python-dotenv",
    "cryptography>=41",
    "debugpy>=1.8,<2",

    # ── async networking ──────────────────────────────────────────────────
    "aiohttp",

    # ── scheduling & tasks ────────────────────────────────────────────────
    "schedule",
    "croniter",

    # ── CLI REPL ──────────────────────────────────────────────────────────
    "prompt_toolkit>=3.0",
    "pyperclip>=1.8",

    # ── WeChat integration ───────────────────────────────────────────────
    "qrcode[pil]",

    # ── GFS ───────────────────────────────────────────────
    "boto3",
    # 
    # "pystray>=0.19",
    # "Pillow>=9.0"
]

[project.scripts]
drsai = "drsai.backend.run_cli:run"
drsai-tui = "drsai.backend.run_cli:run"
drsai-gateway = "drsai.backend.tui_gateway.entry:main"
# ── Optional dependency groups ───────────────────────────────────────────────
# Install with: pip install drsai[pipeline]  /  pip install drsai[all]

[project.optional-dependencies]
# OpenWebUI pipeline adapter — auth + session handling
pipeline = [
    "passlib",
    "jwt",
    "python-multipart",
    "json_schema_to_pydantic",
]

# ChromaDB vector store (alternative memory backend)
chromadb = [
    "chromadb",
]

# Azure model provider
azure = [
    "autogen-ext[azure]==0.5.7",
]

# Ollama local model provider
ollama = [
    "autogen-ext[ollama]==0.5.7",
]

# Evaluation & benchmarking
eval = [
    "huggingface_hub",
    "pandas",
    "scipy",
]

# Convenience: install everything (worker deps already in core)
all = [
    "drsai[pipeline,chromadb,azure,ollama,eval]",
]


[tool.uv]
dev-dependencies = [
    "poethepoet",
    "pyright==1.1.389",
    "mypy==1.13.0",
    "ruff==0.4.8",
    "pytest_asyncio",
    "pytest-cov",
    "pytest",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx_rtd_theme",
    "types-aiofiles",
    "types-docker",
    "types-PyYaml"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.poe.tasks]
fmt = "ruff format src"
format.ref = "fmt src"
lint = "ruff check src"
mypy = "mypy src"
pyright = "pyright src"
test.env = { PYTHONPATH = "src" }
test.sequence = [
    "playwright install",
    "pytest tests --cov=src --cov-report=xml --cov-report=term-missing",
]
test.default_item_type = "cmd"
check = ["fmt", "lint", "pyright", "test"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

# from https://blog.wolt.com/engineering/2021/09/30/professional-grade-mypy-configuration/
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = false

disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_unimported = true

[tool.pyright]
include = ["src", "tests", "samples"]
typeCheckingMode = "off"
reportUnnecessaryIsInstance = false
reportMissingTypeStubs = false


[tool.hatch.build.targets.wheel]
include-package-data = true
packages = [
    "src/drsai",
    ]

[tool.hatch.build.targets.wheel.force-include]
# Include the pre-built ui-tui bundle inside the wheel so PyPI users get a
# self-contained install (only Node.js runtime required, no pnpm/npm/node_modules).
# The custom build hook (build_hook.py) auto-compiles the TUI before the wheel
# is assembled — you no longer need to build manually before pip install.
"../../../../apps/ui-tui/dist/entry.mjs" = "drsai/ui_tui/dist/entry.mjs"
"../../../../apps/ui-tui/package.json"   = "drsai/ui_tui/package.json"
"../../../../cores/protocol/owop/owop.schema.json" = "drsai/owop/owop.schema.json"
"src/drsai/owop/node_pty_provider.cjs" = "drsai/owop/node_pty_provider.cjs"

[tool.hatch.build.hooks.custom]
path = "build_hook.py"

[tool.hatch.version]
path = "src/drsai/version.py"

[tool.hatch.build]
include = [
  "src/drsai/**/*.py",
  "src/drsai/**/*.yaml",
  "src/drsai/**/*.json",
  "src/drsai/**/*.js",
  "src/drsai/**/*.mjs",
]
exclude = [
  "src/drsai/tests/**",
  "src/drsai/backend/_deprecated/**",
  "**/__pycache__",
  "**/.*.swp",
]
ignore-vcs = true 
