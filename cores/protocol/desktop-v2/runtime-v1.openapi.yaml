openapi: 3.1.0

info:
  title: DrSai Desktop V2 Runtime API
  version: "1.0.0"
  x-protocol-version: drsai-desktop/1
  x-status: draft
  description: |
    The complete HTTP surface the V2 Desktop renderer talks to. 41 endpoints in
    ten groups (A-J), specified in
    `apps/desktop/docs/v2/desktop-v2-architecture-and-runtime-contract.zh-CN.md`.

    Three rules shape this document, and reviewers should hold new entries to them:

    1. The renderer calls these endpoints directly over HTTP/SSE. Electron IPC
       carries native capabilities only, capped at 15 channels. The previous
       desktop declared every feature four times -- route, main-process client,
       IPC channel, renderer facade -- and reached 432 channels.
    2. There is exactly one event stream, per session (C7). No run-level stream
       exists. Every UI state must be reconstructible from C5 + C6.
    3. New capability should arrive as a new OAEP item type or tool_call, not as
       a new endpoint. Web search (group J) is the worked example: zero endpoints.

    Event payloads are not redefined here. They `$ref` into
    `cores/protocol/oaep/oaep.schema.json`, which stays the single source of
    truth; the TypeScript types are generated from it.

servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "28642"

security:
  - runtimeToken: []

tags:
  - name: A. Auth
    description: Capability group 1. Interactive OIDC runs in the Electron main process; the runtime only ever sees an id_token.
  - name: B. Runtime & Runs
    description: Capability group 3.
  - name: C. Session
    description: Capability group 6. Holds the single event stream.
  - name: D. Workspace
    description: Capability group 5.
  - name: E. Models
    description: Capability group 4.
  - name: F. Config
    description: Capability group 2.
  - name: G. Skills
    description: Capability group 7.
  - name: H. GFS
    description: Capability group 9. New integration, not a migration - see the contract doc.
  - name: I. Voice
    description: Capability group 8. Speech-to-text only.

paths:

  # ---------------------------------------------------------------- A. Auth
  /v1/auth/session:
    post:
      tags: [A. Auth]
      operationId: createAuthSession
      summary: Exchange an OIDC id_token for a runtime token
      description: |
        The HepAI access_token never enters the runtime. The id_token is verified
        against JWKS and its `sub` becomes `user_id`, which is a first-class key
        on the session and workspace tables from the first migration onward.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        "200":
          description: Runtime session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/auth/me:
    get:
      tags: [A. Auth]
      operationId: getCurrentUser
      summary: Current identity
      responses:
        "200":
          description: Identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/auth/refresh:
    post:
      tags: [A. Auth]
      operationId: refreshAuthSession
      summary: Renew the runtime token
      responses:
        "200":
          description: Renewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/auth/logout:
    post:
      tags: [A. Auth]
      operationId: logout
      summary: Revoke the current runtime token
      responses:
        "204": { description: Revoked }

  # ------------------------------------------------------- B. Runtime & Runs
  /v1/runtime:
    get:
      tags: [B. Runtime & Runs]
      operationId: getRuntime
      summary: Runtime identity and protocol version
      description: |
        Startup handshake. Desktop and runtime ship independently, so a
        `protocol_version` mismatch must surface as "please update" rather than
        a blank window.
      security: []
      responses:
        "200":
          description: Runtime identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeIdentity" }

  /v1/capabilities:
    get:
      tags: [B. Runtime & Runs]
      operationId: getCapabilities
      summary: Declared capabilities and emitted item types
      description: |
        The only supported basis for feature degradation. Clients must not gate
        optional features on version numbers.
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }

  /v1/sessions/{session_id}/runs:
    post:
      tags: [B. Runtime & Runs]
      operationId: createRun
      summary: Start a run
      description: |
        Returns immediately; output never streams on this response. Everything
        the run produces arrives on C7. That is what makes background runs,
        multi-window sync, and reconnect work without extra machinery.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunRequest" }
      responses:
        "202":
          description: Run queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunAccepted" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: An identical idempotency_key is already in flight
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunAccepted" }

  /v1/runs/{run_id}:
    get:
      tags: [B. Runtime & Runs]
      operationId: getRun
      summary: Run status
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "../oaep/oaep.schema.json#/$defs/run" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/runs/{run_id}/cancel:
    post:
      tags: [B. Runtime & Runs]
      operationId: cancelRun
      summary: Cancel a running run
      description: |
        Not optional. Streaming chat without a stop button is unusable, and
        adding `cancelled` to the run state machine after the fact would ripple
        through every client state machine.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "../oaep/oaep.schema.json#/$defs/run" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/runs/{run_id}/interactions/{item_id}:
    post:
      tags: [B. Runtime & Runs]
      operationId: respondToInteraction
      summary: Answer an interaction item
      description: |
        v1 reserves the endpoint and the run `waiting` state but ships no UI.
        Approvals and clarifying questions are certain to arrive; holding the
        slot now costs nothing, retrofitting the state machine would not.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: item_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: {}
      responses:
        "204": { description: Recorded }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------- C. Session
  /v1/sessions:
    post:
      tags: [C. Session]
      operationId: createSession
      summary: Create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: { type: string }
                title: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "../oaep/oaep.schema.json#/$defs/session" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      tags: [C. Session]
      operationId: listSessions
      summary: List sessions in a workspace
      description: |
        Each item carries `updated_at` and `last_run_status` so the sidebar can
        render session state without an N+1 fetch.
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Page of sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPage" }

  /v1/sessions/{session_id}:
    patch:
      tags: [C. Session]
      operationId: updateSession
      summary: Rename or archive a session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string }
                status: { type: string, enum: [active, archived] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "../oaep/oaep.schema.json#/$defs/session" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [C. Session]
      operationId: deleteSession
      summary: Soft-delete a session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Marked deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/sessions/{session_id}/snapshot:
    get:
      tags: [C. Session]
      operationId: getSessionSnapshot
      summary: Full conversation snapshot
      description: Fetched once when the session is opened, and again on a history gap.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 2000, default: 500 }
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "../oaep/oaep.schema.json#/$defs/snapshot" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/sessions/{session_id}/events:
    get:
      tags: [C. Session]
      operationId: listSessionEvents
      summary: Backfill events after a sequence
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/AfterSequence"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        "200":
          description: Page of events
          content:
            application/json:
              schema: { $ref: "../oaep/oaep.schema.json#/$defs/eventPage" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: |
            `history_gap` -- the runtime can no longer serve from that sequence.
            Clients fall back to the snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/sessions/{session_id}/events/stream:
    get:
      tags: [C. Session]
      operationId: streamSessionEvents
      summary: Live event stream (SSE)
      description: |
        The single stream. One OAEP event per frame; a `: ping` comment every 15
        seconds detects half-open connections.

        Reconnect contract, which must ship in v1 because retrofitting it is
        expensive: the client persists `last_sequence` and reconnects with
        `after_sequence`; a 409 `history_gap` sends it to the snapshot;
        duplicates are dropped by `dedupe_key`. `sequence` is strictly
        monotonic within a session.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/AfterSequence"
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: History gap; fall back to the snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  # ----------------------------------------------------------- D. Workspace
  /v1/workspaces:
    get:
      tags: [D. Workspace]
      operationId: listWorkspaces
      summary: List workspaces
      description: |
        Always returns at least the implicit default workspace
        (`$DRSAI_HOME/workspaces/default`), so creating a session never requires
        creating a workspace first.
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Workspace" }
    post:
      tags: [D. Workspace]
      operationId: createWorkspace
      summary: Open a directory as a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string }
                display_name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace_id}/files:
    get:
      tags: [D. Workspace]
      operationId: listWorkspaceFiles
      summary: List workspace entries
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: path
          in: query
          schema: { type: string, default: "" }
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 3, default: 1 }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/FileEntry" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace_id}/file:
    get:
      tags: [D. Workspace]
      operationId: readWorkspaceFile
      summary: Read a file
      description: |
        Backs the preview pane. Supports `Range`. Paths are checked for
        workspace escape and rejected with 403 `workspace_escape`.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File bytes
          headers:
            ETag: { schema: { type: string } }
            X-Digest: { schema: { type: string }, description: sha256 of the content }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: Partial content }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/workspaces/{workspace_id}/uploads:
    post:
      tags: [D. Workspace]
      operationId: uploadWorkspaceResource
      summary: Upload an input attachment
      description: |
        The input side of resources. Without it the `resource` parts in a run
        request have no way to come into existence.
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedResource" }
        "413": { $ref: "#/components/responses/Error" }

  # -------------------------------------------------------------- E. Models
  /v1/models:
    get:
      tags: [E. Models]
      operationId: listModels
      summary: Selectable models
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelCatalog" }

  /v1/config/model:
    put:
      tags: [E. Models]
      operationId: setDefaultModel
      summary: Persist the default model
      description: |
        Model choice is a run parameter; this only persists the default for runs
        that omit it. The provider management surface is deliberately absent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id]
              properties:
                model_id: { type: string }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_id: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  # -------------------------------------------------------------- F. Config
  /v1/config:
    get:
      tags: [F. Config]
      operationId: getConfig
      summary: Read persisted configuration
      description: |
        One document in place of the nineteen independent CRUD routes the old
        gateway grew. Secrets are deliberately excluded -- this payload is read
        often and can reach logs and error reports.
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
    patch:
      tags: [F. Config]
      operationId: updateConfig
      summary: Partial update
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Config" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Config" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/config/secrets:
    get:
      tags: [F. Config]
      operationId: listSecrets
      summary: Which secrets are configured
      description: Returns names and presence only. Values are never readable.
      responses:
        "200":
          description: Secret names
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, configured]
                      properties:
                        key: { type: string }
                        configured: { type: boolean }

  /v1/config/secrets/{key}:
    put:
      tags: [F. Config]
      operationId: setSecret
      summary: Write a secret
      parameters:
        - $ref: "#/components/parameters/SecretKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      tags: [F. Config]
      operationId: deleteSecret
      summary: Remove a secret
      parameters:
        - $ref: "#/components/parameters/SecretKey"
      responses:
        "204": { description: Removed }

  # -------------------------------------------------------------- G. Skills
  /v1/skills:
    get:
      tags: [G. Skills]
      operationId: listSkills
      summary: Installed and available skills
      responses:
        "200":
          description: Skills
          content:
            application/json:
              schema:
                type: object
                required: [installed, available]
                properties:
                  installed:
                    type: array
                    items: { $ref: "#/components/schemas/Skill" }
                  available:
                    type: array
                    items: { $ref: "#/components/schemas/Skill" }

  /v1/skills/install:
    post:
      tags: [G. Skills]
      operationId: installSkill
      summary: Install a skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                source: { type: string }
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/skills/{skill_name}:
    delete:
      tags: [G. Skills]
      operationId: uninstallSkill
      summary: Uninstall a skill
      parameters:
        - name: skill_name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }

  # ----------------------------------------------------------------- H. GFS
  /v1/gfs/health:
    get:
      tags: [H. GFS]
      operationId: gfsHealth
      summary: GFS reachability and mode
      description: |
        Gated by the `gfs` capability. This group is a new integration: the nine
        routes exist in `backend/gfs_api.py`, but the gateway never mounted
        them, so nothing has exercised them from the desktop. Two things must be
        settled before implementing the rest of this group -- how the desktop
        OIDC identity maps onto GFS auth (today it is a `GFS_API_KEY` env var),
        and what decides personal mode.
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  personal_mode: { type: boolean }
        "503": { $ref: "#/components/responses/Error" }

  /v1/gfs/list:
    post:
      tags: [H. GFS]
      operationId: gfsList
      summary: List a GFS directory
      requestBody: { $ref: "#/components/requestBodies/GfsPath" }
      responses:
        "200": { $ref: "#/components/responses/GfsEntries" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/gfs/stat:
    post:
      tags: [H. GFS]
      operationId: gfsStat
      summary: Stat a GFS path
      requestBody: { $ref: "#/components/requestBodies/GfsPath" }
      responses:
        "200": { $ref: "#/components/responses/GfsEntry" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/gfs/read:
    post:
      tags: [H. GFS]
      operationId: gfsRead
      summary: Read a GFS file
      requestBody: { $ref: "#/components/requestBodies/GfsPath" }
      responses:
        "200":
          description: Content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }

  /v1/gfs/write:
    post:
      tags: [H. GFS]
      operationId: gfsWrite
      summary: Write a GFS file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path: { type: string }
                content: { type: string }
      responses:
        "200": { $ref: "#/components/responses/GfsEntry" }
        "403": { $ref: "#/components/responses/Error" }

  /v1/gfs/upload:
    post:
      tags: [H. GFS]
      operationId: gfsUpload
      summary: Upload a local file to GFS
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, path]
              properties:
                file: { type: string, format: binary }
                path: { type: string }
      responses:
        "201": { $ref: "#/components/responses/GfsEntry" }
        "413": { $ref: "#/components/responses/Error" }

  /v1/gfs/download:
    post:
      tags: [H. GFS]
      operationId: gfsDownload
      summary: Download a GFS file into a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, workspace_id]
              properties:
                path: { type: string }
                workspace_id: { type: string }
                destination: { type: string }
      responses:
        "201":
          description: Downloaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadedResource" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/gfs/delete:
    post:
      tags: [H. GFS]
      operationId: gfsDelete
      summary: Delete a GFS path
      requestBody: { $ref: "#/components/requestBodies/GfsPath" }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/gfs/share-url:
    post:
      tags: [H. GFS]
      operationId: gfsShareUrl
      summary: Create a share URL
      requestBody: { $ref: "#/components/requestBodies/GfsPath" }
      responses:
        "200":
          description: Share URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Error" }

  # --------------------------------------------------------------- I. Voice
  /v1/audio/transcriptions:
    post:
      tags: [I. Voice]
      operationId: transcribeAudio
      summary: Speech to text
      description: |
        Gated by `audio.stt`. Voice is a side service, deliberately outside the
        run contract: the output is text dropped into the composer, so it can be
        switched off or fail without touching the main path. Realtime duplex and
        TTS are out of scope for v1.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                language: { type: string }
      responses:
        "200":
          description: Transcript
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: { type: string }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

components:

  securitySchemes:
    runtimeToken:
      type: http
      scheme: bearer

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string }
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: { type: string }
    SecretKey:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
    AfterSequence:
      name: after_sequence
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  requestBodies:
    GfsPath:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [path]
            properties:
              path: { type: string }

  responses:
    Error:
      description: Failure, in the shared error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    GfsEntry:
      description: A single GFS entry
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GfsEntry" }
    GfsEntries:
      description: GFS entries
      content:
        application/json:
          schema:
            type: object
            required: [entries]
            properties:
              entries:
                type: array
                items: { $ref: "#/components/schemas/GfsEntry" }

  schemas:

    ErrorEnvelope:
      type: object
      required: [error]
      description: |
        Mirrors `backend/runtime/error_contract.py`. Clients show `message` plus
        the single call to action mapped from `recovery_actions[0]`; raw codes
        stay in the diagnostics panel. `message` must never carry tokens, paths,
        commands, prompts, or stack text.
      properties:
        error:
          type: object
          required: [code, category, message, retryable, recovery_actions]
          properties:
            code: { type: string }
            category:
              type: string
              enum: [binding, auth, transport, contract, model, approval, resource, history, runtime, backend, unknown]
            message: { type: string }
            retryable: { type: boolean }
            recovery_actions:
              type: array
              items:
                type: string
                enum: [retry, login, sync, repair, new_task, select_model, remove_resource, reconnect, diagnostics]
            request_id: { type: string }

    User:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, description: The OIDC subject. }
        display_name: { type: string }
        email: { type: string }
        avatar_url: { type: string }

    AuthSession:
      type: object
      required: [runtime_token, expires_at, user]
      properties:
        runtime_token: { type: string, description: Opaque; unrelated to the HepAI token. }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    RuntimeIdentity:
      type: object
      required: [runtime_id, instance_id, version, protocol_version, oaep_version]
      properties:
        runtime_id: { type: string }
        instance_id: { type: string }
        version: { type: string }
        protocol_version: { type: string, const: drsai-desktop/1 }
        oaep_version: { type: string, const: "1.0" }
        oaep_profile: { type: string, const: oaep.session-stream/1 }

    Capabilities:
      type: object
      required: [capabilities, item_types]
      properties:
        capabilities:
          type: array
          items:
            type: string
            enum: [chat.stream, workspace.files, workspace.preview, models.select, skills, gfs, audio.stt, web.search]
        item_types:
          type: array
          items: { $ref: "../oaep/oaep.schema.json#/$defs/itemType" }

    RunRequest:
      type: object
      required: [idempotency_key, parts]
      properties:
        idempotency_key:
          type: string
          description: Required, so a retried submit cannot start a second run.
        parts:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: object
                required: [type, text]
                properties:
                  type: { type: string, const: text }
                  text: { type: string }
              - type: object
                required: [type, resource_id]
                properties:
                  type: { type: string, const: resource }
                  resource_id: { type: string }
        model:
          type: string
          description: Optional; falls back to the session's last model.

    RunAccepted:
      type: object
      required: [run_id, status]
      properties:
        run_id: { type: string }
        status: { type: string, enum: [queued, running] }

    SessionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "../oaep/oaep.schema.json#/$defs/session"
              - type: object
                properties:
                  last_run_status:
                    type: string
                    enum: [queued, running, waiting, completed, failed, cancelled]
                    description: Lets the sidebar render state without an N+1 fetch.
        next_cursor:
          type: [string, "null"]

    Workspace:
      type: object
      required: [workspace_id, path, display_name, created_at]
      properties:
        workspace_id: { type: string }
        path: { type: string }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
        is_default: { type: boolean }

    FileEntry:
      type: object
      required: [path, name, kind]
      properties:
        path: { type: string, description: Relative to the workspace root. }
        name: { type: string }
        kind: { type: string, enum: [file, dir] }
        size: { type: integer }
        mtime: { type: string, format: date-time }
        mime_type: { type: string }

    UploadedResource:
      type: object
      required: [resource_id, name, size]
      properties:
        resource_id: { type: string }
        name: { type: string }
        mime_type: { type: string }
        size: { type: integer }
        digest: { type: string }

    ModelCatalog:
      type: object
      required: [items, default]
      properties:
        items:
          type: array
          items:
            type: object
            required: [model_id, display_name, available]
            properties:
              model_id: { type: string }
              display_name: { type: string }
              provider: { type: string }
              available: { type: boolean }
              capabilities:
                type: array
                items: { type: string, enum: [vision, tools] }
        default: { type: [string, "null"] }

    Config:
      type: object
      description: |
        Everything persisted and safely readable. Secrets live behind
        `/v1/config/secrets` and never appear here.
      properties:
        default_model: { type: [string, "null"] }
        web_search_enabled: { type: boolean }
        platforms:
          type: object
          additionalProperties: { type: boolean }
        tools:
          type: object
          additionalProperties: { type: boolean }

    Skill:
      type: object
      required: [name, installed]
      properties:
        name: { type: string }
        display_name: { type: string }
        description: { type: string }
        version: { type: string }
        source: { type: string }
        installed: { type: boolean }

    GfsEntry:
      type: object
      required: [path, kind]
      properties:
        path: { type: string }
        name: { type: string }
        kind: { type: string, enum: [file, dir] }
        size: { type: integer }
        mtime: { type: string, format: date-time }
